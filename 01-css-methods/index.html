<!DOCTYPE html>

<html>

<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Method for Adding CSS</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        p {
            width: 1900px;
            text-align: left;
            color: white;
            background-color: green;
            font-size: 18px;
            font-family: 'Times New Roman', Times, serif, serif;
        }
    </style>
</head>

<body>
    <div>Style me via the external method!</div>

    <p>I would like to be styled with the internal method, please.</p>

    <button
        style="display: block; width: 120px; margin: 2px; color: black; background: orange; font-size: 18px; font-family: 'Times New Roman', Times, serif; border-width: 2px; border-color: lightgrey;">
        Inline Method
    </button>

</body>

</html>
